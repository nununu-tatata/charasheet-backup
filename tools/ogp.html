<!DOCTYPE html>

<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@900&display=swap" rel="stylesheet">
<style>

  iframe { position: absolute; top: 0; left: -185px; width: 1320px; height: 900px; border: 0; transform: scale(1.12); transform-origin: top left; }
  .text { position: absolute; inset: 0; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 900; color: #8c7b75; }

<body>
  <iframe src="/docs/index.html"></iframe>
  <div class="text">
    <div class="t big">キャラシをスプシに保存</div>
    <div class="t sub">ボタン一つで全キャラ更新！<br>CoC6版キャラシ一括バックアップ<br>マイリストから一括取得</div>
